services:
  - type: web
    name: biess-api
    runtime: go
    plan: free
    region: oregon
    buildCommand: go build -o bin/api ./backend/cmd/api
    startCommand: ./bin/api
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: POSTGRES_HOST
        fromDatabase:
          name: biess-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: biess-db
          property: port
      - key: POSTGRES_USER
        fromDatabase:
          name: biess-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: biess-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: biess-db
          property: database
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: biess-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: biess-redis
          property: port
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: keyvalue
    name: biess-redis
    plan: free
    region: oregon
    ipAllowList: []

  - type: web
    name: biess-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: biess-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: biess-db
    databaseName: biess
    user: biess
    plan: free
    region: oregon
